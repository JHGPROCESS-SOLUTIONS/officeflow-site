<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wachtwoord resetten – OfficeFlow</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#F97316">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #F97316;
      --orange-2: #EA580C;
      --navy: #08142f;
      --text: #0F172A;
      --text-2: #64748B;
      --border: #E2E8F0;
      --warm: #fdfaf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--warm) 0%, #fef8ef 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(15,23,42,.06);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 32px;
      color: var(--navy);
      letter-spacing: -.01em;
    }
    .logo svg { flex-shrink: 0; display: block; }
    .logo .logo-text { line-height: 1; }
    .logo .flow {
      background: linear-gradient(90deg, #F97316, #FB923C);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.01em; }
    .subtitle { color: var(--text-2); font-size: 15px; margin-bottom: 28px; line-height: 1.55; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--orange); }
    .btn-primary {
      width: 100%;
      background: var(--orange);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
    }
    .btn-primary:hover { background: var(--orange-2); }
    .btn-primary:disabled { opacity: .6; }
    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert.show { display: block; }
    .back-link { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-2); text-decoration: none; }
    .back-link:hover { color: var(--orange); }
    @media (max-width: 480px) {
      body { padding: 16px; align-items: flex-start; padding-top: 24px; }
      .auth-card { padding: 28px 22px; border-radius: 16px; }
      .logo { font-size: 20px; margin-bottom: 24px; }
      h1 { font-size: 22px; }
      .subtitle { font-size: 14px; margin-bottom: 22px; }
      input { padding: 14px 14px; font-size: 16px; }
      .btn-primary { padding: 15px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <a href="/" class="logo" aria-label="OfficeFlow">
      <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
        <defs><linearGradient id="of-resetpw-mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F97316"/><stop offset="100%" stop-color="#FB923C"/></linearGradient></defs>
        <rect width="48" height="48" rx="11" fill="url(#of-resetpw-mark)"/>
        <circle cx="24" cy="24" r="11" fill="none" stroke="#fff" stroke-width="3.2"/>
        <path d="M21.5 19.5 L28 24 L21.5 28.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">Office<span class="flow">Flow</span></span>
    </a>

    <!-- MODE 1: request reset email -->
    <div id="request-mode">
      <h1>Wachtwoord vergeten?</h1>
      <p class="subtitle">Vul je e-mailadres in, we sturen je een link om een nieuw wachtwoord in te stellen.</p>

      <div class="alert alert-error" id="err-request"></div>
      <div class="alert alert-ok" id="ok-request"></div>

      <form id="request-form">
        <div class="form-group">
          <label for="email">E-mailadres</label>
          <input type="email" id="email" required autocomplete="email" placeholder="jij@bedrijf.nl" />
        </div>
        <button type="submit" class="btn-primary" id="request-btn">Reset-link versturen</button>
      </form>
      <a href="/login.html" class="back-link">← Terug naar inloggen</a>
    </div>

    <!-- MODE 2: set new password after clicking email link -->
    <div id="set-mode" style="display:none;">
      <h1>Nieuw wachtwoord</h1>
      <p class="subtitle">Kies een nieuw wachtwoord om weer in te loggen.</p>

      <div class="alert alert-error" id="err-set"></div>

      <form id="set-form">
        <div class="form-group">
          <label for="new-pw">Nieuw wachtwoord</label>
          <input type="password" id="new-pw" required autocomplete="new-password" minlength="8" />
        </div>
        <div class="form-group">
          <label for="confirm-pw">Bevestig wachtwoord</label>
          <input type="password" id="confirm-pw" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary" id="set-btn">Wachtwoord opslaan</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://lvjdqpklkueajxzznaqq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2amRxcGtsa3VlYWp4enpuYXFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODc5MTMsImV4cCI6MjA4OTc2MzkxM30.vnUBZpET7spcQ0oIhSwSFeZZdw1F2WYcYul2lbyotsk';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Als er een recovery-session is (via link uit email) → toon set-mode
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('request-mode').style.display = 'none';
        document.getElementById('set-mode').style.display = 'block';
      }
    });

    // MODE 1 — vraag reset-link
    document.getElementById('request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('request-btn');
      const err = document.getElementById('err-request');
      const ok = document.getElementById('ok-request');
      err.classList.remove('show');
      ok.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Bezig…';

      const email = document.getElementById('email').value.trim();
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password.html'
      });

      if (error) {
        err.textContent = error.message;
        err.classList.add('show');
      } else {
        ok.textContent = 'Check je inbox — we hebben je een link gestuurd.';
        ok.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = 'Reset-link versturen';
    });

    // MODE 2 — stel nieuw wachtwoord in
    document.getElementById('set-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('set-btn');
      const err = document.getElementById('err-set');
      err.classList.remove('show');

      const pw = document.getElementById('new-pw').value;
      const confirm = document.getElementById('confirm-pw').value;

      if (pw.length < 8) {
        err.textContent = 'Wachtwoord moet minimaal 8 tekens zijn.';
        err.classList.add('show');
        return;
      }
      if (pw !== confirm) {
        err.textContent = 'De wachtwoorden komen niet overeen.';
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Bezig…';

      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        err.textContent = error.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Wachtwoord opslaan';
        return;
      }
      window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
