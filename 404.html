<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Pagina niet gevonden – OfficeFlow</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#F97316">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .wrap {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.01em;
      margin-bottom: 32px;
      text-decoration: none;
      color: #0F172A;
    }

    .logo svg { flex-shrink: 0; display: block; }

    .logo span {
      background: linear-gradient(90deg, #F97316, #FB923C);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, #F97316, #FB923C);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      margin: 0 0 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #0F172A;
    }

    p {
      color: #475569;
      line-height: 1.6;
      margin: 0 0 32px;
      font-size: 16px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all .15s;
      border: 1.5px solid transparent;
    }

    .btn-primary {
      background: #F97316;
      color: #fff;
    }
    .btn-primary:hover { background: #EA580C; }

    .btn-ghost {
      background: #fff;
      color: #475569;
      border-color: #E2E8F0;
    }
    .btn-ghost:hover {
      border-color: #F97316;
      color: #F97316;
    }

    @media (max-width: 480px) {
      .code { font-size: 72px; }
      h1 { font-size: 22px; }
      p { font-size: 15px; }
      .btn { width: 100%; justify-content: center; }
      .actions { flex-direction: column; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <a href="/" class="logo" aria-label="OfficeFlow">
      <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true">
        <defs><linearGradient id="of-404-mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F97316"/><stop offset="100%" stop-color="#FB923C"/></linearGradient></defs>
        <rect width="48" height="48" rx="11" fill="url(#of-404-mark)"/>
        <circle cx="24" cy="24" r="11" fill="none" stroke="#fff" stroke-width="3.2"/>
        <path d="M21.5 19.5 L28 24 L21.5 28.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Office<span>Flow</span>
    </a>

    <div class="code">404</div>
    <h1>Deze pagina bestaat niet</h1>
    <p>De link is misschien verouderd of het adres klopt niet helemaal.<br>Geen probleem — terug naar de startpagina en je vindt vanzelf wat je zoekt.</p>

    <div class="actions">
      <a href="/" class="btn btn-primary">← Terug naar home</a>
      <a href="/dashboard.html" class="btn btn-ghost">Naar dashboard</a>
    </div>
  </div>
</body>
</html>
